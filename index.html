<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alif Rahma Nur Faizah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(233, 30, 99, 0.15);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff8fa3;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .profile-name {
            font-size: 1.5rem;
            color: #ff4d6d;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <img src="rahmacantik.jpeg" alt="Alif Rahma Nur Faizah" class="profile-pic">
        <h1 class="profile-name">Alif Rahma Nur Faizah</h1>
    </div>

</body>
</html>
